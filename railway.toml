[build]
builder = "DOCKERFILE"

# GlycoQuant — two-service Railway deployment under one project.
#
# This file is documentation. The actual service config lives in each
# service's dashboard settings; the block below is the canonical
# reference for recreating the stack from scratch.
#
# Production topology (2026-04-11 onward):
#
#   Railway "api"   → FastAPI + React dispatcher (CPU-only)
#   Railway "web"   → nginx + compiled Vite bundle (CPU-only)
#   Modal           → serverless L4 container running the heavy pipeline
#                     (Cellpose-SAM + DINOv2 + scikit-image features)
#
# The Railway api service NEVER runs Cellpose itself; it serializes the
# channel dict and calls ``modal.Function.lookup("glycoquant-gpu",
# "run_pipeline").remote(...)``. See backend/modal_app.py for the GPU
# function and scripts/deploy_modal.sh for the one-shot deploy command.
#
# -----------------------------------------------------------------------
# Service "api"  (backend, CPU-only, dispatches to Modal)
# -----------------------------------------------------------------------
#   Source repo:        orgavaa/GlycoQuant
#   Branch:             main
#   Root directory:     /           (the full repo — backend/Dockerfile
#                                    needs access to glycoquant/, data/,
#                                    configs/)
#   Builder:            Dockerfile  (NOT Railpack — switch the dropdown
#                                    in Settings → Build → Builder)
#   Dockerfile path:    backend/Dockerfile
#
#   Build Args:
#     TORCH_VARIANT         = cpu      (Railway api is CPU-only now;
#                                        GPU work is offloaded to Modal)
#
#   Runtime env vars:
#     GLYCOQUANT_GPU_PROVIDER = modal   (flip to 'local' for a pure-CPU
#                                         fallback if Modal is down)
#     MODAL_TOKEN_ID        = ak-...    (from ~/.modal.toml after
#                                         'modal token new')
#     MODAL_TOKEN_SECRET    = as-...
#     CORS_ORIGINS          = https://<web-service-domain>.up.railway.app
#
#   Resources:
#     CPU:                  1-2 vCPU
#     RAM:                  1-2 GB
#     GPU:                  none — Modal handles every inference call
#
#   Persistent volume:    none required — the Modal volume
#                         "glycoquant-models" holds the Cellpose + HF
#                         caches on the GPU side.
#
#   Healthcheck path:     /health
#   Serverless:           ON  (scale to zero; GPU is only billed when
#                               a request is in flight)
#
# -----------------------------------------------------------------------
# Service "web"  (frontend, CPU-only, static nginx)
# -----------------------------------------------------------------------
#   Source repo:        orgavaa/GlycoQuant
#   Branch:             main
#   Root directory:     frontend
#   Builder:            Dockerfile
#   Dockerfile path:    Dockerfile   (relative to frontend/ root)
#
#   Build Args:
#     VITE_API_BASE_URL   = https://<api-service-domain>.up.railway.app
#     (baked into the Vite bundle at build time — redeploy on change)
#
#   Resources:
#     CPU:                  1 vCPU
#     RAM:                  512 MB
#
#   Healthcheck path:     /
#   Serverless:           ON
#
# -----------------------------------------------------------------------
# Deployment order (chicken-and-egg — because web bakes VITE_API_BASE_URL):
#
#   1. Create "api" with CORS_ORIGINS=* (temporarily), deploy, note URL
#   2. Create "web" with VITE_API_BASE_URL=<api url>, deploy
#   3. Update "api" CORS_ORIGINS to the real web URL, redeploy
#
# -----------------------------------------------------------------------
# Modal GPU worker (deployed separately, once, from a developer machine)
# -----------------------------------------------------------------------
#   Setup:
#     pip install modal
#     modal token new                      # one-time browser auth
#     bash scripts/deploy_modal.sh         # or: modal deploy backend/modal_app.py
#
#   What it deploys:
#     App name:     glycoquant-gpu
#     Function:     run_pipeline
#     GPU:          L4
#     Volume:       glycoquant-models  (holds ~1.5 GB of model weights,
#                                        downloaded once and cached forever)
#     Timeout:      600 s per call
#
#   Auth on Railway:
#     Set MODAL_TOKEN_ID and MODAL_TOKEN_SECRET on the api service; the
#     Modal SDK picks them up automatically on import.
#
# -----------------------------------------------------------------------
# First-deploy cost to expect:
#   The Modal container downloads the full 1.5 GB Cellpose-SAM + DINOv2
#   weights on its first invocation, streaming into the glycoquant-models
#   Volume. Subsequent cold starts skip the download and complete in
#   ~15-20 s. Warm calls finish a single 768² image in ~25-30 s
#   (segmentation + feature extraction + optional DINOv2 embedding).
