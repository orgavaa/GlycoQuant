[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "glycoquant"
version = "0.0.1"
description = "Glycocalyx mechanotransduction analysis platform (Labouesse group, ETH Zurich)"
requires-python = ">=3.10"
authors = [{ name = "Valentin Uzan" }]
license = { text = "MIT" }
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "python-multipart>=0.0.12",
    "pydantic>=2.9",
    "cellpose>=3.0",
    "scikit-image>=0.22",
    "numpy>=1.24",
    "pandas>=2.0",
    "scipy>=1.11",
    "plotly>=5.18",
    "networkx>=3.2",
    "scikit-learn>=1.3",
    "pyyaml>=6.0",
    "transformers>=4.40",
    "pillow>=10.0",
    "umap-learn>=0.5",
    "requests>=2.30",
    "tifffile>=2024.0",
    "modal>=0.64",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "ruff>=0.3",
    "pre-commit>=3.5",
]
scripts = [
    "transformers",
    "geneformer",
    "anndata",
    "scanpy",
    "cellxgene-census",
    "requests",
    "remotezip",  # used by scripts/download_bbbc_plate_field.py
]
cell_dino = [
    # Optional deps required by the channel-adaptive Cell-DINO ViT-L/16
    # backbone (loaded via torch.hub from third_party/dinov2). torch and
    # transformers are already pulled in via the base ``dependencies``
    # block (cellpose / DINOv2-base path), so this only needs the dinov2
    # repo's runtime helpers. The Cell-DINO checkpoint itself is gated
    # by the FAIR Non-Commercial Research License — see
    # docs/CELL_DINO_SETUP.md for the operator runbook.
    "fvcore",
    "iopath",
    "omegaconf",
]

[tool.setuptools.packages.find]
include = ["glycoquant*"]
exclude = ["tests*", "scripts*", "data*", "results*"]

[tool.pytest.ini_options]
testpaths = ["tests", "backend/tests"]
python_files = ["test_*.py"]
addopts = "-ra --strict-markers"
pythonpath = ["."]
markers = [
    "slow: tests that download models or run multi-minute inference",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["N802", "N803"]
