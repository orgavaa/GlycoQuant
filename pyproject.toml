[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "glycoquant"
version = "0.0.1"
description = "Glycocalyx mechanotransduction analysis platform (Labouesse group, ETH Zurich)"
requires-python = ">=3.10"
authors = [{ name = "Valentin Uzan" }]
license = { text = "MIT" }
dependencies = [
    "streamlit>=1.30",
    "cellpose>=3.0",
    "scikit-image>=0.22",
    "numpy>=1.24",
    "pandas>=2.0",
    "scipy>=1.11",
    "plotly>=5.18",
    "networkx>=3.2",
    "scikit-learn>=1.3",
    "pyyaml>=6.0",
    "transformers>=4.40",
    "pillow>=10.0",
    "umap-learn>=0.5",
    "requests>=2.30",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "ruff>=0.3",
    "pre-commit>=3.5",
]
scripts = [
    "transformers",
    "geneformer",
    "anndata",
    "scanpy",
    "cellxgene-census",
    "requests",
]

[tool.setuptools.packages.find]
include = ["glycoquant*"]
exclude = ["tests*", "scripts*", "data*", "results*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-ra --strict-markers"
markers = [
    "slow: tests that download models or run multi-minute inference",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["N802", "N803"]
