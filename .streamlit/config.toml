[theme]
# GlycoQuant — techbio dark theme.
# Palette inspired by Recursion Phenoscope / Insitro / Schrödinger Maestro.
base = "dark"
primaryColor = "#4F8FFF"
backgroundColor = "#0B0E1A"
secondaryBackgroundColor = "#141829"
textColor = "#E8EBF5"
font = "sans serif"

[server]
headless = false
runOnSave = true

[browser]
gatherUsageStats = false

[client]
toolbarMode = "minimal"
showErrorDetails = true
